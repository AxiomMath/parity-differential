# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "ParityDifferential"
  authors: [Kenny Lau]
  description: >
    `ParityDifferential` is a formal proof of the combinatorial identity behind the parity of
    $k$-differentials in genus zero and one. For odd $k \ge 3$ and $m = (k-1)/2$, let $N_k(n)$
    count the pairs $(b_1, b_2)$ with $1 \le b_1, b_2 \le m$, $b_1 + b_2 \ge m + 1$ and
    $b_2 \equiv n b_1 \pmod k$, and let $F_k(a) = \sum_{i=1}^{m} \lfloor (ai + m)/k \rfloor$.
    It proves $N_k(n) = F_k(n+1) - F_k(n)$. The Lean files were generated by AxiomProver,
    Axiom Math's in-house theorem proving system.
  responsible_maintainers: [Kenny Lau]
  license: "MIT"

repository:
  role: "substantive-development"

sources:
  - title: "Parity of $k$-differentials in genus zero and one"
    authors: [Dawei Chen, Evan Chen, Kenny Lau, Ken Ono, Jujian Zhang]
    id: "https://arxiv.org/abs/2602.03722"
    type: "article"
    location: "Lemma 2.5 (Formula for $N_k(n)$)"
    relationship: "formalizes"
    note: >
      The paper's appendix documents this repository as the formalization of Lemma 2.5.

classification:
  arxiv: [math.NT, math.AG, math.GT]
  msc2020: [11A07, 14H10, 32G15]

status:
  scope: >
    Lemma 2.5, the combinatorial core of the proof of Theorem 1.2, for every odd $k \ge 3$ and
    every $n$. `problem.lean` defines $N_k$ and $F_k$ outright and states the identity between
    them.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  main_results:
  - declaration: "main_theorem"
    file: "ParityDifferential/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"

automation:
  methods:
    - method: "autonomous"
      models: [AxiomProver]

review:
  status: "author-verified"
  reviewers: [Kenny Lau]
  notes: >
    The formal problem statement in `ParityDifferential/problem.lean` was checked against the
    source paper by an author of that paper.

alignment:
  statements:
    - source: "Lemma 2.5 (Formula for $N_k(n)$): $N_k(n) = F_k(n+1) - F_k(n)$"
      lean: "main_theorem"
      module: "ParityDifferential.solution"
      status: >
        Proved. The identity is stated over $\mathbb{Z}$ so that $F_k(n+1) - F_k(n)$ is the honest
        difference rather than truncated subtraction on $\mathbb{N}$, and the floor in $F_k$ is
        Lean's natural number division. The hypotheses $\gcd(n,k) = 1$ and $\gcd(n+1,k) = 1$ are
        declared but never used, so the proof gives the stronger form noted in Remark 2.
